# Pipeline de demonstracao do build do RM Toolkit no Azure DevOps.
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    displayName: 'Obter codigo'

  - task: UseNode@1
    displayName: 'Configurar Node.js 24'
    inputs:
      version: '24.x'

  - script: npm ci
    displayName: 'Instalar dependencias'

  - script: npm run build
    displayName: 'Compilar TypeScript, Vite e Electron'

  - publish: $(Build.SourcesDirectory)/dist
    artifact: frontend
    displayName: 'Publicar artefato do frontend'

  - publish: $(Build.SourcesDirectory)/dist-electron
    artifact: electron
    displayName: 'Publicar artefato do Electron'
